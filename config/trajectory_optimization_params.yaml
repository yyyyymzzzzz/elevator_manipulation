# 轨迹优化参数配置文件 - 修复版本
jaka_arm_controller:
  ros__parameters:
    # 关节空间中跳过中间点的最小距离阈值（弧度）
    # 0.3弧度 ≈ 17度，更大的阈值来确保优化效果
    min_joint_distance: 0.5
    
    # 是否启用路径优化
    # true: 启用优化，跳过距离很近的中间点
    # false: 禁用优化，执行所有轨迹点
    enable_path_optimization: true
    
    # 轨迹点之间的执行延迟（秒）
    # 防止命令积压，让arm_controller有时间处理每个命令
    point_execution_delay: 0.0
    
    # 优化后最大保留的轨迹点数量
    # 目前只保留为最终目标点
    max_trajectory_points: 1