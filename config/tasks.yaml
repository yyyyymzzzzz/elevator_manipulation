tasks:
  - name: "完整的多楼层电梯测试"
    steps:
        - step_id: "导航到1楼的A点"
          task_type: "navigation"
          location: "A_Point_F1"   
        # # --- 阶段 1: 在1楼呼叫电梯 ---
        - step_id: "导航到1楼电梯面板前"
          task_type: "navigation"
          location: "F1_Panel"  

        - step_id: "按压'上行'按钮"
          task_type: "button_press"
          button: "button_up"         

      # --- 阶段 2: 等待并进入电梯 ---
        - step_id: "导航到1楼电梯门前等待"
          task_type: "navigation"
          location: "F1_Door_Outside"

        - step_id: "等待电梯门开启"
          task_type: "wait_for_door"

        - step_id: "进入电梯并转向内部面板"
          task_type: "motion_sequence"
          sequence: "enter_elevator"  

      # --- 阶段 3: 在电梯内选择楼层 ---
        - step_id: "按压楼层'2'"
          task_type: "button_press"
          button: "button_2"

      # --- 阶段 4: 观察面板并识别2楼 ---
        - step_id: "识别2楼'"
          task_type: "look_at_panel"
          floor: "2"        

      # --- 阶段 5: 等待并离开电梯 ---
        - step_id: "从内部面板转向电梯门"
          task_type: "motion_sequence"
          sequence: "panel_to_door"  

        - step_id: "到达2楼后，等待电梯门开启"
          task_type: "wait_for_door"

        - step_id: "驶出电梯并更新位姿到2楼"
          task_type: "exit_and_update_pose"
          map_name: "test_floor_2"       
          floor: "2"                       # 目标楼层
          location: "F2_Door_Outside"      

