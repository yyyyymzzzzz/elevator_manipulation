# 实时按钮目标位置规划器配置参数

realtime_button_target_planner:
  ros__parameters:
    # 测试模式开关
    require_agv_control: false     # 是否需要AGV控制指令才发布目标 (测试视觉时设为false)
    
    # 目标位置计算参数
    target_distance: 0.14          # 目标位置距按钮的距离 (m)
    use_fixed_normal: true         # 是否使用固定法向量（避免复杂的点云计算）
    # 法向方向可能需要根据具体坐标系定义而调整
    fixed_normal_x: 0.0            # 固定法向量 X 分量
    fixed_normal_y: 1.0            # 固定法向量 Y 分量  
    fixed_normal_z: 0.0           # 固定法向量 Z 分量
    # 使用纯视觉模式需要更改坐标系配置
    # fixed_normal_x: -1.0          
    # fixed_normal_y: 0.0         
    # fixed_normal_z: 0.0     
    
    # 坐标系配置
    target_frame: "world"
    # 如果使用纯视觉模式，请将target_link更改为"camera_link"
    camera_frame: "camera_color_optical_frame"
    
    # 可视化参数
    marker_scale: 0.01
    marker_lifetime: 0.5           # 较短的标记生命周期以提高响应性
    
    # 实时性优化参数
    enable_smoothing: false        # 位置平滑已禁用，直接使用检测位置
    smoothing_alpha: 0.3           # 平滑系数 (已禁用)
    max_position_change: 0.05      # 最大位置变化阈值 (已禁用)
    publish_frequency: 30.0        # 发布频率 (Hz) - 高频发布
    
    # 按钮选择方法: 'sequential' | 'all' | 'closest'
    # sequential: 顺序切换发布每个按钮
    # all: 同时发布所有按钮的目标位置JSON
    # closest: 只发布最近的按钮目标位置
    button_selection_method: "sequential"
    # button_selection_method: "all"
    sequential_duration: 20.0      # 顺序模式下每个按钮的持续时间 (s)
    
    # 目标清理参数
    target_cleanup_interval: 2.0   # 清理检查间隔 (s)
    target_expiry_time: 5.0        # 目标过期时间 (s) 
